    <circle cx="80" cy="80" r="54" stroke-width="2" stroke-opacity=".62"/>
    <g stroke-width="1.6" stroke-opacity=".45">
      <path d="M80 22v8"/><path d="M80 130v8"/><path d="M22 80h8"/><path d="M130 80h8"/>
    </g>
    <path d="M87.8 72.2 112.5 47.5" stroke="#5CA3A6" stroke-width="2"/>
  </g>
  <circle cx="80" cy="80" r="6" fill="#E66A2C"/>
  <circle cx="118" cy="42" r="7" fill="#5CA3A6"/>
