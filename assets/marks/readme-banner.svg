<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Orbital Archive No. 01</title>
  <desc id="desc">Lunar Signal Modernism title field with plotted aerospace trajectories, horizon arcs, calibration marks, and archival texture.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#54BCD9" stroke-opacity=".08"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H1440" stroke="#E7E1D5" stroke-opacity=".028"/></pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="41" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E66A2C"/><stop offset=".42" stop-color="#CBAE67"/><stop offset="1" stop-color="#54BCD9" stop-opacity=".1"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2D3A42" stop-opacity=".9"/><stop offset="1" stop-color="#11181E" stop-opacity=".78"/></linearGradient>
  </defs>
  <rect width="1440" height="560" fill="#11181E"/>
  <rect width="1440" height="560" fill="url(#grid)"/>
  <rect width="1440" height="560" fill="url(#scan)"/>
  <path d="M0 432H1440" stroke="#56656E" stroke-opacity=".52"/>
  <path d="M0 438H1440" stroke="#54BCD9" stroke-opacity=".22" stroke-dasharray="1 18"/>
