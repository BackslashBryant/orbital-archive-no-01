    <path d="M742 620C900 300 1188 208 1514 318" stroke="#54BCD9" stroke-width="1.7" stroke-opacity=".88"/>
    <path d="M850 614C1010 408 1236 358 1484 408" stroke="#CBAE67" stroke-width="1.3" stroke-dasharray="9 11" stroke-opacity=".82"/>
