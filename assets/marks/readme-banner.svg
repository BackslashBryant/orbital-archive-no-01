<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Orbital Archive No. 01 — v1.8.0</title>
  <desc id="desc">Lunar Signal Modernism title field with the Orbital Archive mark, a plotted trajectory readout with nodes anchored on the path, calibration marks, and archival texture.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5CA3A6" stroke-opacity=".08"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H1440" stroke="#E7E1D5" stroke-opacity=".028"/></pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="41" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2D3A42" stop-opacity=".9"/><stop offset="1" stop-color="#11181E" stop-opacity=".78"/></linearGradient>
  </defs>
  <rect width="1440" height="560" fill="#11181E"/>
  <rect width="1440" height="560" fill="url(#grid)"/>
  <rect width="1440" height="560" fill="url(#scan)"/>
  <path d="M0 432H1440" stroke="#56656E" stroke-opacity=".52"/>
  <path d="M0 438H1440" stroke="#5CA3A6" stroke-opacity=".2" stroke-dasharray="1 18"/>

  <!-- brand mark, top left -->
  <g fill="none" stroke="#E7E1D5" stroke-linecap="round">
    <ellipse cx="74" cy="54" rx="20" ry="9" transform="rotate(-28 74 54)" stroke-width="1.1" stroke-opacity=".4"/>
    <circle cx="74" cy="54" r="18" stroke-width="1.6" stroke-opacity=".62"/>
    <path d="M79 47 84.6 41.4" stroke="#5CA3A6" stroke-width="1.6"/>
  </g>
  <circle cx="74" cy="54" r="3" fill="#E66A2C"/>
  <circle cx="86.7" cy="41.3" r="3.2" fill="#5CA3A6"/>

  <!-- plotted trajectory readout, upper right; nodes sit exactly on the path -->
  <g fill="none" stroke-linecap="round">
    <path d="M992 156v-6M1093 156v-6M1194 156v-6M1295 156v-6M1396 156v-6" stroke="#56656E" stroke-opacity=".55"/>
    <path d="M992 156H1396" stroke="#56656E" stroke-opacity=".55"/>
    <path d="M992 136 1093 122 1194 116 1295 110 1396 116" stroke="#CBAE67" stroke-width="1.3" stroke-dasharray="8 9" stroke-opacity=".8"/>
    <path d="M992 130 1093 108 1194 120 1295 92 1396 104" stroke="#5CA3A6" stroke-width="1.8"/>
  </g>
  <g fill="#11181E" stroke="#5CA3A6" stroke-width="1.8">
    <circle cx="992" cy="130" r="5"/><circle cx="1093" cy="108" r="5"/><circle cx="1194" cy="120" r="5"/><circle cx="1295" cy="92" r="5"/>
  </g>
  <circle cx="1396" cy="104" r="5" fill="#E66A2C"/>
  <text x="992" y="80" fill="#5CA3A6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">PLOTTED VECTOR / CURRENT REV</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">
    <text x="108" y="58" fill="#5CA3A6">LUNAR SIGNAL MODERNISM / THEME 01</text>
    <text x="58" y="500" fill="#CBAE67">CALM</text><text x="116" y="500" fill="#98A4AC">EXACT</text><text x="180" y="500" fill="#98A4AC">CONCISE</text><text x="262" y="500" fill="#98A4AC">FORWARD-LOOKING</text>
    <text x="1160" y="500" fill="#98A4AC">ARCHIVE REF</text><text x="1324" y="500" fill="#CBAE67">OA-1.8.0</text>
  </g>
  <g font-family="'Arial Narrow', 'Roboto Condensed', sans-serif" font-weight="700" letter-spacing="-5">
    <text x="54" y="233" fill="#E7E1D5" font-size="116">ORBITAL ARCHIVE</text>
    <text x="54" y="356" fill="#E66A2C" font-size="134">NO. 01</text>
  </g>
  <text x="60" y="405" fill="#98A4AC" font-family="Inter, system-ui, sans-serif" font-size="19">Present dramatically. Operate calmly. Scale completely.</text>
  <g transform="translate(1042 188)">
    <rect width="330" height="122" fill="url(#panel)" stroke="#CBAE67" stroke-opacity=".72"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.2">
      <text x="18" y="29" fill="#98A4AC">NATIVE ICONS</text><text x="300" y="29" text-anchor="end" fill="#CBAE67">161</text>
      <text x="18" y="53" fill="#98A4AC">CONTRACTS</text><text x="300" y="53" text-anchor="end" fill="#CBAE67">49</text>
      <text x="18" y="77" fill="#98A4AC">APPLICATIONS</text><text x="300" y="77" text-anchor="end" fill="#CBAE67">13</text>
      <text x="18" y="101" fill="#98A4AC">STATUS</text><text x="300" y="101" text-anchor="end" fill="#7EB79E">NOMINAL</text>
    </g>
  </g>
  <rect width="1440" height="560" filter="url(#grain)" opacity=".42"/>
  <path d="M18 18h38M18 18v38M1422 18h-38M1422 18v38M18 542h38M18 542v-38M1422 542h-38M1422 542v-38" fill="none" stroke="#98A4AC" stroke-opacity=".48"/>
</svg>
