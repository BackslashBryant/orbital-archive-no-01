  <g fill="#11181E" stroke="#5CA3A6" stroke-width="2">
    <circle cx="132" cy="600" r="6"/>
    <circle cx="700" cy="287" r="6"/>
  </g>
  <circle cx="1160" cy="262" r="6" fill="#E66A2C"/>
