<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" viewBox="0 0 320 120">
  <defs>
    <pattern id="lsm-phosphor-dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect x="0" y="0" width="1" height="1" fill="#5CA3A6" opacity=".55"/>
      <rect x="2" y="2" width="1" height="1" fill="#5CA3A6" opacity=".4"/>
      <rect x="1" y="3" width="1" height="1" fill="#CB7248" opacity=".22"/>
    </pattern>
    <pattern id="lsm-phosphor-scan" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#E7E1D5" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="320" height="120" fill="#11181E"/>
  <rect width="320" height="120" fill="url(#lsm-phosphor-dither)"/>
  <rect width="320" height="120" fill="url(#lsm-phosphor-scan)"/>
</svg>
